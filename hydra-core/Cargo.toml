[package]
name = "hydra-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hkdf = "0.12"
x509-parser = "0.16"

# Tor (Arti)
arti-client = { version = "0.39", features = [
    "tokio", "onion-service-client", "onion-service-service",
] }
tor-hsservice = "0.39"
tor-hscrypto = "0.39"
tor-rtcompat = { version = "0.39", features = ["tokio"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
dirs = "5"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
