[workspace]
members = ["gemini-core"]

[package]
name = "cosmic-gemini"
version = "0.1.0"
edition = "2021"

[dependencies]
gemini-core = { path = "gemini-core" }
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
    "a11y", "about", "tokio", "winit", "wayland", "wgpu",
] }
tokio = { version = "1", features = ["full"] }
url = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
