[package]
name = "gemini-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
url = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
log = "0.4"
futures = "0.3"
dirs = "5"
once_cell = "1"
tempfile = "3"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
